# Vectorization expectations for CI regression detection.
#
# Each [[expect]] entry declares a function that MUST be auto-vectorized.
# CI fails if LLVM optimization remarks don't show vectorization for any
# listed function.
#
# Fields:
#   function    — Rust symbol substring to match in LLVM remark output
#   min_width   — minimum vectorization width (f32=4, i16=8, f64=2 on NEON)
#   description — human-readable note for failure messages
#
# Add new entries in the same PR that adds the vectorized code.

# Phase 1 findings (Task 9):
#
# filter_voxels_by_threshold (processor.rs)
#   NOT vectorized. LLVM analysis: "Cannot vectorize early exit loop" /
#   "instruction cannot be vectorized". The conditional-push pattern
#   (if dbz >= threshold { vec.push(idx) }) is a compress/filter operation
#   that LLVM's auto-vectorizer cannot handle. Requires explicit SIMD
#   intrinsics (e.g., SVE compact, NEON TBL, or manual bitmask compress)
#   to vectorize — targeted for Phase 2.
#
# compute_phase_scores_branchless (phase_batch.rs)
#   NOT vectorized. LLVM analysis: "value that could not be identified as
#   reduction is used outside the loop" / "Incorrect number of successors
#   from early exiting block". The per-voxel scoring function call and
#   multiple output arrays prevent auto-vectorization — targeted for
#   Phase 2 with explicit intrinsics.
#
# No [[expect]] entries yet — both candidates require explicit SIMD (Phase 2).

# Phase 2 (current):
#
# Both functions are now explicitly vectorized using the `wide` crate:
#
# filter_voxels_by_threshold (processor.rs)
#   Uses wide::i16x8 comparison + LUT compress for branchless index collection.
#   Performance: ~1.9x speedup over scalar baseline on aarch64 NEON.
#
# compute_phase_scores_branchless (phase_batch.rs)
#   Uses wide::f32x4 for stages 1-6 (precip flag, freezing level, wet bulb,
#   surface temp, bright band, RQI normalization). Stages 7-13 use scalar
#   per-lane extraction due to complex discrete logic.
#   Performance: ~14% improvement over branchless scalar on aarch64 NEON.
#
# No [[expect]] entries for wide-based code. The `wide` crate compiles to
# platform-specific SIMD intrinsics directly — LLVM's auto-vectorization
# remarks will not report these as "vectorized loops".
#
# Wire format migration (AVMR v4, AVET v2, AVTR v2) changed from AoS to SoA
# layout for all three protocols. This enables zero-copy decode paths and
# better cache locality for SIMD operations.
