[package]
name = "approach-viz-server-wasm"
version = "0.1.0"
edition = "2024"
description = "WASM exports for the web server routes: R2 weather scan packs and the direct traffic fallback"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
approach-viz-core = { path = "../approach-viz-core" }
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
