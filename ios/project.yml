name: ApproachViz
options:
  createIntermediateGroups: true
packages:
  ComposableArchitecture:
    url: https://github.com/pointfreeco/swift-composable-architecture.git
    from: 1.25.2
  CasePaths:
    url: https://github.com/pointfreeco/swift-case-paths.git
    from: 1.7.2
  Dependencies:
    url: https://github.com/pointfreeco/swift-dependencies.git
    from: 1.11.0
  Perception:
    url: https://github.com/pointfreeco/swift-perception.git
    from: 2.0.9
  IdentifiedCollections:
    url: https://github.com/pointfreeco/swift-identified-collections.git
    from: 1.1.1
  SwiftNavigation:
    url: https://github.com/pointfreeco/swift-navigation.git
    from: 2.7.0
  XCTestDynamicOverlay:
    url: https://github.com/pointfreeco/xctest-dynamic-overlay.git
    from: 1.9.0
  AsyncAlgorithms:
    url: https://github.com/apple/swift-async-algorithms.git
    from: 1.1.3
  SwiftCollections:
    url: https://github.com/apple/swift-collections.git
    from: 1.4.1
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing.git
    from: 1.19.0
  SwiftUIIntrospect:
    url: https://github.com/siteline/swiftui-introspect.git
    from: 26.0.1
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 7.6.0
  Nuke:
    url: https://github.com/kean/Nuke.git
    from: 12.8.0
  FloatingPanel:
    url: https://github.com/scenee/FloatingPanel.git
    from: 3.2.1
settings:
  base:
    DEVELOPMENT_TEAM: ''
    CLANG_ENABLE_EXPLICIT_MODULES: NO
    ENABLE_APP_INTENTS_METADATA_GENERATION: NO
    SWIFT_ENABLE_EXPLICIT_MODULES: NO
targets:
  ApproachViz:
    type: application
    platform: iOS
    deploymentTarget: '18.0'
    transitivelyLinkDependencies: true
    sources:
      - path: ApproachViz
        excludes:
          - RustBridge/Generated/**
      - path: ApproachViz/RustBridge/Generated/Swift/approach_viz_core.swift
    dependencies:
      - sdk: AppIntents.framework
      - framework: ApproachViz/RustBridge/Generated/ApproachVizCoreFFI.xcframework
      - package: ComposableArchitecture
        product: ComposableArchitecture
      - package: Dependencies
        product: Dependencies
      - package: CasePaths
        product: CasePaths
      - package: Perception
        product: Perception
      - package: IdentifiedCollections
        product: IdentifiedCollections
      - package: SwiftNavigation
        product: SwiftNavigation
      - package: SwiftNavigation
        product: SwiftUINavigation
      - package: SwiftNavigation
        product: UIKitNavigation
      - package: XCTestDynamicOverlay
        product: IssueReporting
      - package: XCTestDynamicOverlay
        product: XCTestDynamicOverlay
      - package: AsyncAlgorithms
        product: AsyncAlgorithms
      - package: SwiftCollections
        product: OrderedCollections
      - package: SwiftUIIntrospect
        product: SwiftUIIntrospect
      - package: GRDB
        product: GRDB
      - package: Nuke
        product: Nuke
      - package: FloatingPanel
        product: FloatingPanel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andyfang.approachviz
        PRODUCT_NAME: ApproachViz
        SWIFT_VERSION: '6.0'
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ApproachViz/App/Info.plist
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CLANG_ENABLE_MODULES: YES
        CLANG_ENABLE_EXPLICIT_MODULES: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: '1,2'
        IPHONEOS_DEPLOYMENT_TARGET: '18.0'
        LD_RUNPATH_SEARCH_PATHS: '$(inherited) @executable_path/Frameworks'
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_ENABLE_EXPLICIT_MODULES: NO
    scheme:
      testTargets:
        - ApproachVizSnapshotTests
      preActions:
        - name: Bootstrap Rust Bridge
          settingsTarget: ApproachViz
          script: |
            set -euo pipefail
            BRIDGE_DIR="$PROJECT_DIR/ApproachViz/RustBridge/Generated"
            SWIFT_FILE="$BRIDGE_DIR/Swift/approach_viz_core.swift"
            if [[ ! -d "$BRIDGE_DIR/ApproachVizCoreFFI.xcframework" || ! -f "$SWIFT_FILE" ]]; then
              echo "note: bootstrapping missing Rust bridge artifacts"
              bash "$PROJECT_DIR/../scripts/build-ios-bridge.sh"
            fi
    preBuildScripts:
      - name: Verify Rust Bridge
        inputFiles:
          - $(PROJECT_DIR)/ApproachViz/RustBridge/Generated/ApproachVizCoreFFI.xcframework/Info.plist
          - $(PROJECT_DIR)/ApproachViz/RustBridge/Generated/Swift/approach_viz_core.swift
        outputFiles:
          - $(DERIVED_FILE_DIR)/verify-rust-bridge.stamp
        script: |
          set -euo pipefail
          BRIDGE_DIR="$PROJECT_DIR/ApproachViz/RustBridge/Generated"
          SWIFT_FILE="$BRIDGE_DIR/Swift/approach_viz_core.swift"
          if [[ ! -d "$BRIDGE_DIR/ApproachVizCoreFFI.xcframework" || ! -f "$SWIFT_FILE" ]]; then
            echo "error: missing Rust bridge artifacts; scheme bootstrap should have generated them"
            exit 1
          fi
          mkdir -p "$DERIVED_FILE_DIR"
          touch "$DERIVED_FILE_DIR/verify-rust-bridge.stamp"
      - name: Copy SQLite Database
        inputFiles:
          - $(PROJECT_DIR)/../data/approach-viz.sqlite
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/approach-viz.sqlite
        script: |
          set -euo pipefail
          SRC="$PROJECT_DIR/../data/approach-viz.sqlite"
          DST_DIR="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          DST="$DST_DIR/approach-viz.sqlite"
          mkdir -p "$DST_DIR"
          if [[ -f "$SRC" ]]; then
            cp "$SRC" "$DST"
          else
            echo "warning: missing $SRC; run npm run prepare-data"
          fi
      - name: Copy Approach Reference Data
        inputFiles:
          - $(PROJECT_DIR)/../public/data/approach-db/approaches.json
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/approaches.json
        script: |
          set -euo pipefail
          SRC="$PROJECT_DIR/../public/data/approach-db/approaches.json"
          DST_DIR="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          DST="$DST_DIR/approaches.json"
          mkdir -p "$DST_DIR"
          if [[ -f "$SRC" ]]; then
            cp "$SRC" "$DST"
          else
            echo "warning: missing $SRC; run npm run prepare-data"
          fi
  ApproachVizSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '18.0'
    transitivelyLinkDependencies: true
    sources:
      - path: ApproachVizSnapshotTests
    dependencies:
      - sdk: AppIntents.framework
      - target: ApproachViz
      - package: SnapshotTesting
        product: SnapshotTesting
      - package: ComposableArchitecture
        product: ComposableArchitecture
      - package: Dependencies
        product: Dependencies
      - package: CasePaths
        product: CasePaths
      - package: Perception
        product: Perception
      - package: IdentifiedCollections
        product: IdentifiedCollections
      - package: SwiftNavigation
        product: SwiftNavigation
      - package: SwiftNavigation
        product: SwiftUINavigation
      - package: SwiftNavigation
        product: UIKitNavigation
      - package: XCTestDynamicOverlay
        product: IssueReporting
      - package: XCTestDynamicOverlay
        product: XCTestDynamicOverlay
    settings:
      base:
        SWIFT_VERSION: '6.0'
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ApproachViz.app/ApproachViz
        CLANG_ENABLE_EXPLICIT_MODULES: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_ENABLE_EXPLICIT_MODULES: NO
